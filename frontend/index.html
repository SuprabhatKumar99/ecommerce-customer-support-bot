<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-commerce Support Portal</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 40px; background: #f8fafc; color: #1e293b; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        h1 { font-size: 24px; margin-bottom: 20px; color: #0f172a; }
        p { line-height: 1.5; color: #475569; }
        .links { margin-top: 30px; display: flex; gap: 15px; }
        a.btn { display: inline-block; padding: 12px 24px; background: #2563eb; color: white; text-decoration: none; border-radius: 8px; font-weight: 500; }
        a.btn.agent { background: #0f172a; }
        a.btn:hover { opacity: 0.9; }
    </style>
</head>
<body>
    <div class="container">
        <h1>E-commerce Customer Support System</h1>
        <p>Production-ready MVP featuring LangGraph orchestration, deterministic e-commerce tools, RAG over PostgreSQL pgvector, and real-time SSE human agent escalation.</p>
        <div class="links">
            <a href="customer.html" class="btn">Launch Customer Chat</a>
            <a href="agent.html" class="btn agent">Open Agent Dashboard</a>
        </div>
    </div>
</body>
</html>
